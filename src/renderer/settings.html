<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>设置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="settings-body">
    <div id="app" class="panel">
      <header class="bar">
        <span class="ttl">设置<span class="ver" id="ver"></span></span>
        <span class="grow"></span>
        <button class="icon close" id="btnClose" title="关闭">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      </header>
      <div id="body" class="view settings-view"></div>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
